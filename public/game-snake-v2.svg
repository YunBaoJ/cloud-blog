<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="400" height="400" fill="#FAF6EE"/>

  <!-- Snake Outer Border -->
  <path
    d="M 120 250 C 100 210, 100 170, 150 140 C 200 110, 260 110, 240 180 C 220 240, 140 230, 210 300 C 240 330, 270 300, 280 270"
    fill="none"
    stroke="#1D3323"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Snake Main Green Body -->
  <path
    d="M 120 250 C 100 210, 100 170, 150 140 C 200 110, 260 110, 240 180 C 220 240, 140 230, 210 300 C 240 330, 270 300, 280 270"
    fill="none"
    stroke="#34543C"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Red Food Dot -->
  <circle cx="320" cy="275" r="12" fill="#B84A39" />

  <!-- Snake Head (Right end at 280, 270) -->
  <!-- Outer Head -->
  <ellipse cx="288" cy="270" rx="20" ry="17" fill="#34543C" stroke="#1D3323" stroke-width="3" />

  <!-- Big Cute Eye 1 (Top Eye) -->
  <circle cx="295" cy="263" r="6" fill="#FFFFFF" />
  <circle cx="297" cy="263" r="3" fill="#111F14" />
  <circle cx="298.5" cy="261.5" r="1" fill="#FFFFFF" />

  <!-- Big Cute Eye 2 (Bottom Eye) -->
  <circle cx="295" cy="277" r="6" fill="#FFFFFF" />
  <circle cx="297" cy="277" r="3" fill="#111F14" />
  <circle cx="298.5" cy="275.5" r="1" fill="#FFFFFF" />
</svg>
